<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PyQuest — Learn Python from zero, right in your browser</title>
  <meta name="description" content="An interactive Python course that runs entirely in your browser. 20 stages and 56 hands-on exercises from your first print() to classes, generators and decorators — with XP, badges and nothing to install." />
  <meta name="theme-color" content="#FBF7ED" />
  <meta property="og:title" content="PyQuest — Learn Python by actually writing it" />
  <meta property="og:description" content="Real Python runs on the page: type code, press Run, earn XP and badges. 20 stages, beginner to expert, zero setup." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23EDF3EC'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia,serif' font-size='30' font-weight='600' fill='%23346538'%3EP%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.1.0/index.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.1.0/500.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.1.0/600.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.1.0/index.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.1.0/500.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=19" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <button class="panel-toggle" id="panel-toggle" aria-label="Hide side panel" aria-expanded="true" title="Hide side panel">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.4"/>
            <line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
        <a class="wordmark" href="#" id="home-link">PyQuest</a>
      </div>
      <div class="topbar-right">
        <span class="engine-chip" id="engine-chip">
          <span class="engine-dot loading"></span>
          <span id="engine-label">Starting Python engine</span>
        </span>
        <span class="level-tag" id="level-tag">Hatchling</span>
        <div class="xp-pill">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 1.5l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.3l-3.8 2 .7-4.3-3.1-3 4.3-.6L8 1.5z" fill="#8C6516"/>
          </svg>
          <span id="xp-count">0</span>&nbsp;XP
        </div>
      </div>
    </div>
  </header>

  <div class="shell">

    <aside class="sidebar">
      <p class="sidebar-heading">Your journey</p>
      <p class="progress-note" id="progress-note">0 of 25 exercises</p>
      <div class="journey-rail">
        <div class="vine-layer" id="vine-layer" aria-hidden="true"></div>
        <nav class="stage-list" id="stage-list"></nav>
      </div>
      <div id="sidebar-foot"></div>
    </aside>

    <main class="main" id="main"></main>

  </div>

  <footer class="footer">
    <div class="footer-inner">
      <p>PyQuest — an interactive Python course, beginner to expert.</p>
      <p class="footer-meta">No account&ensp;·&ensp;No install&ensp;·&ensp;Progress saved on this device</p>
    </div>
  </footer>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Progress update"></div>
  </div>

  <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>

  <script src="illustrations.js?v=4"></script>
  <script src="lessons.js?v=6"></script>
  <script src="firewall.js?v=7"></script>
  <script src="app.js?v=17"></script>
</body>
</html>
