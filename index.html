<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PyQuest — Learn Python from zero, right in your browser</title>
  <meta name="description" content="An interactive Python course that runs entirely in your browser. 20 stages and 56 hands-on exercises from your first print() to classes, generators and decorators — with XP, badges and nothing to install." />
  <meta name="theme-color" content="#FBF7ED" />
  <meta property="og:title" content="PyQuest — Learn Python by actually writing it" />
  <meta property="og:description" content="Real Python runs on the page: type code, press Run, earn XP and badges. 20 stages, beginner to expert, zero setup." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%23FBF7ED'/%3E%3Ccircle cx='32' cy='32' r='29' fill='none' stroke='%232E5E3A' stroke-width='2'/%3E%3Cpath d='M32 52 C18 40 18 22 36 12 C46 26 44 42 32 52 Z' fill='%232E5E3A' fill-opacity='0.16' stroke='%232E5E3A' stroke-width='2.6' stroke-linejoin='round'/%3E%3Cpath d='M32 52 C30 38 32 24 36 12' fill='none' stroke='%232E5E3A' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.1.0/index.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.1.0/500.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.1.0/600.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.1.0/index.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.1.0/500.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=29" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="#" id="home-link">PyQuest</a>

      <div class="account-menu" id="account-menu">
        <button class="account-trigger" id="account-trigger" aria-haspopup="true" aria-expanded="false" aria-label="Progress and account">
          <span class="account-mark" id="account-mark">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 21 C5 16 5 8 13 4 C17 10 17 17 12 21 Z" fill="currentColor" fill-opacity="0.18"
                    stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M12 21 C11 15 12 9 13 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="account-trigger-name" id="account-trigger-name"></span>
          <svg class="account-caret" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
            <path d="M2 4 L5 7 L8 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="account-panel" id="account-panel" hidden>
          <div class="panel-row">
            <span class="panel-label">Rank</span>
            <span class="panel-value" id="level-tag">Hatchling</span>
          </div>
          <div class="panel-row">
            <span class="panel-label">Earned</span>
            <span class="panel-value xp-pill"><span id="xp-count">0</span>&nbsp;XP</span>
          </div>
          <div class="panel-row">
            <span class="panel-label">Python</span>
            <span class="panel-value engine-chip" id="engine-chip">
              <span class="engine-dot loading"></span>
              <span id="engine-label">Starting Python engine</span>
            </span>
          </div>
          <div class="panel-account" id="account-slot"></div>
        </div>
      </div>
    </div>
  </header>

  <div class="shell">

    <aside class="sidebar">
      <div class="sidebar-head">
        <p class="sidebar-heading">Your journey</p>
        <button class="panel-toggle" id="panel-toggle" aria-label="Hide side panel" aria-expanded="true" title="Hide side panel">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.4"/>
            <line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
      </div>
      <p class="progress-note" id="progress-note">0 of 25 exercises</p>
      <div class="journey-rail">
        <div class="vine-layer" id="vine-layer" aria-hidden="true"></div>
        <nav class="stage-list" id="stage-list"></nav>
      </div>
      <div id="sidebar-foot"></div>
    </aside>

    <main class="main" id="main"></main>

  </div>

  <footer class="footer">
    <div class="footer-inner">
      <p>PyQuest — an interactive Python course, beginner to expert.</p>
      <p class="footer-meta">No account&ensp;·&ensp;No install&ensp;·&ensp;Progress saved on this device</p>
    </div>
  </footer>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Progress update"></div>
  </div>

  <button class="panel-reopen" id="panel-reopen" aria-label="Show side panel" title="Show side panel">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.4"/>
      <line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.4"/>
    </svg>
  </button>

  <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>

  <script src="supabase-config.js?v=3"></script>
  <script src="sync.js?v=3"></script>
  <script src="illustrations.js?v=5"></script>
  <script src="lessons.js?v=6"></script>
  <script src="firewall.js?v=11"></script>
  <script src="app.js?v=25"></script>
</body>
</html>
